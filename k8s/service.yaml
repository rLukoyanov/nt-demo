apiVersion: v1
kind: Service
metadata:
  name: worker-headless
  namespace: loadtest
spec:
  clusterIP: None
  selector:
    app: nt-demo
  ports:
    - name: worker
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: loadtest
spec:
  selector:
    role: leader
  ports:
    - name: ui
      port: 8080
      targetPort: 8080