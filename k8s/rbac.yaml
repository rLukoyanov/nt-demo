apiVersion: v1
kind: ServiceAccount
metadata:
  name: nt-demo
  namespace: loadtest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nt-demo-election
  namespace: loadtest
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nt-demo-election
  namespace: loadtest
subjects:
  - kind: ServiceAccount
    name: nt-demo
    namespace: loadtest
roleRef:
  kind: Role
  name: nt-demo-election
  apiGroup: rbac.authorization.k8s.io